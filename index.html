<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>反馈</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
*::-webkit-scrollbar {
  display: none;
}

:root {
  --primary: #7a5af5;
  --secondary: #9c6eff;
  --accent: #c4b5fd;
  --dark: #0f1219;
  --card: #1a1e2d;
  --card-hover: #1e2333;
  --text: #f1f5f9;
  --subtext: #94a3b8;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 10px 35px rgba(0,0,0,0.3);
  --shadow-hover: 0 15px 40px rgba(122,90,245,0.2);
  --border: #2d3548;
  --border-light: #374151;
  --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

/* 底部磨砂提示 */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(40px);
  background: rgba(122, 90, 245, 0.85);
  color: #fff;
  padding: 14px 28px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 600;
  z-index: 9999;
  opacity: 0;
  transition: all 0.6s var(--ease-out);
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 25px rgba(122,90,245,0.25);
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 粒子背景 */
#particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background: #0f1219;
}

body {
  position: relative;
  background: transparent;
  color: var(--text);
  min-height: 100vh;
  padding: 3rem 1rem;
  max-width: 850px;
  margin: 0 auto;
  line-height: 1.7;
  z-index: 1;
}

/* 标题动画 */
.page-title {
  text-align: center;
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 3rem;
  background: linear-gradient(90deg, #7a5af5, #a78bfa, #c4b5fd);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  opacity: 0;
  animation: fadeDown 1.4s var(--ease-out) forwards, gradient 6s linear infinite;
}

/* 卡片容器 */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 2.4rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow);
  opacity: 0;
  animation: fadeUp 1.1s var(--ease-out) forwards;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.05);
  transition: all 0.4s var(--ease);
}
.card:hover {
  background: var(--card-hover);
  box-shadow: var(--shadow-hover);
  transform: translateY(-3px) scale(1.01);
}
.card:nth-child(2) { animation-delay: 0.18s; }
.card:nth-child(3) { animation-delay: 0.32s; }

/* 输入框 */
input, textarea {
  width: 100%;
  background: #121621;
  border: 1px solid var(--border);
  padding: 16px 20px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  color: var(--text);
  margin-bottom: 1.2rem;
  outline: none;
  transition: all 0.35s var(--ease);
}
input:focus, textarea:focus {
  border-color: var(--primary);
  background: #151927;
  transform: translateY(-1px);
  box-shadow: 0 0 0 3px rgba(122,90,245,0.15);
}
textarea {
  min-height: 130px;
  resize: vertical;
}

/* 按钮 */
.btn {
  padding: 16px 30px;
  border-radius: var(--radius-sm);
  border: none;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.35s var(--ease);
  font-size: 15px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  box-shadow: 0 4px 15px rgba(122,90,245,0.3);
}
.btn-primary:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 8px 25px rgba(122,90,245,0.4);
}
.btn-primary:active {
  transform: translateY(0) scale(0.98);
}

.btn-reply {
  background: transparent;
  color: var(--accent);
  font-size: 13px;
  padding: 8px 14px;
  margin-top: 0.8rem;
  border: 1px solid transparent;
  border-radius: 10px;
}
.btn-reply:hover {
  background: rgba(122,90,245,0.12);
  border-color: rgba(122,90,245,0.2);
  color: var(--primary);
  transform: scale(1.03);
}

/* 留言列表 */
.message {
  padding: 1.6rem 0;
  border-bottom: 1px solid var(--border);
  opacity: 0;
  animation: msgSlide 0.8s var(--ease-out) forwards;
}
.message:last-child { border-bottom: none; }

.msg-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 0.8rem;
}
.name {
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
}
.time {
  font-size: 12px;
  color: var(--subtext);
  background: rgba(122,90,245,0.1);
  padding: 2px 8px;
  border-radius: 6px;
}
.content {
  color: #cbd5e1;
  font-size: 15px;
  white-space: pre-wrap;
  line-height: 1.8;
}

/* 回复区域 */
.reply-box {
  margin-top: 1.2rem;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.6s var(--ease);
}
.reply-box.active {
  max-height: 280px;
}

.reply-list {
  margin-left: 1.4rem;
  margin-top: 1.2rem;
  padding-left: 1.2rem;
  border-left: 2px solid var(--border-light);
}
.reply-item {
  padding: 0.9rem 0;
  font-size: 14px;
  color: var(--subtext);
  line-height: 1.6;
  opacity: 0;
  animation: fadeIn 0.6s var(--ease-out) forwards;
}
.reply-item strong {
  color: var(--accent);
  font-weight: 600;
}

.empty {
  text-align: center;
  padding: 4rem 1rem;
  color: #475569;
  font-size: 15px;
  opacity: 0;
  animation: fadeIn 0.8s var(--ease-out) forwards;
}

/* 统一动画体系 */
@keyframes fadeDown {
  from { opacity:0; transform: translateY(-35px); }
  to { opacity:1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(35px); }
  to { opacity:1; transform: translateY(0); }
}
@keyframes msgSlide {
  from { opacity:0; transform: translateX(-20px); }
  to { opacity:1; transform: translateX(0); }
}
@keyframes fadeIn {
  from { opacity:0; }
  to { opacity:1; }
}
@keyframes gradient {
  0% { background-position: 0% center; }
  50% { background-position: 100% center; }
  100% { background-position: 0% center; }
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="particles"></div>
<h1 class="page-title">反馈区</h1>

<div class="card">
  <input type="text" id="name" placeholder="你的昵称">
  <textarea id="content" placeholder="分享你的反馈..."></textarea>
  <button class="btn btn-primary" onclick="sendMsg()">发布留言</button>
</div>

<div class="card" id="msgList">
  <div class="empty">暂无留言，快来发表第一条吧～</div>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

particlesJS("particles", {
  particles: {
    number: { value: 70, density: { enable: true, value_area: 800 } },
    color: { value: "#7a5af5" },
    shape: { type: "circle" },
    opacity: { value: 0.45, random: true },
    size: { value: 2.5, random: true },
    line_linked: { enable: true, distance: 140, color: "#7a5af5", opacity: 0.22, width: 1 },
    move: { enable: true, speed: 0.5, random: true, straight: false, out_mode: "out" }
  },
  interactivity: {
    events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" }, resize: true }
  },
  retina_detect: true
});

const STORAGE = "message_board_v3";
let msgList = JSON.parse(localStorage.getItem(STORAGE)) || [];

function render() {
  const el = document.getElementById("msgList");
  if (msgList.length === 0) {
    el.innerHTML = `<div class="empty">暂无留言，快来发表第一条吧～</div>`;
    return;
  }
  el.innerHTML = msgList.map((item, i) => `
    <div class="message" style="animation-delay: ${i*0.16}s">
      <div class="msg-header">
        <span class="name">${item.name}</span>
        <span class="time">${item.time}</span>
      </div>
      <div class="content">${item.content}</div>
      <button class="btn btn-reply" onclick="toggleReply(${i})">回复</button>
      <div class="reply-box" id="replyBox${i}">
        <input type="text" id="rName${i}" placeholder="昵称">
        <textarea id="rContent${i}" placeholder="回复内容..."></textarea>
        <button class="btn btn-primary" onclick="sendReply(${i})">发送</button>
      </div>
      <div class="reply-list">
        ${(item.reply || []).map((r,j) => `
          <div class="reply-item" style="animation-delay: ${j*0.12}s">
            <div><strong>${r.name}</strong> <span>${r.time}</span></div>
            <div>${r.content}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function sendMsg() {
  const name = document.getElementById("name").value.trim();
  const content = document.getElementById("content").value.trim();
  if (!name || !content) return alert("请填写完整信息");
  msgList.unshift({ name, content, time: new Date().toLocaleString(), reply: [] });
  localStorage.setItem(STORAGE, JSON.stringify(msgList));
  document.getElementById("name").value = "";
  document.getElementById("content").value = "";
  render();
  showToast("✅ 留言发布成功 ✅");
}

function toggleReply(i) {
  const box = document.getElementById(`replyBox${i}`);
  box.classList.toggle("active");
}

function sendReply(i) {
  const name = document.getElementById(`rName${i}`).value.trim();
  const content = document.getElementById(`rContent${i}`).value.trim();
  if (!name || !content) return alert("请填写完整");
  msgList[i].reply.push({ name, content, time: new Date().toLocaleString() });
  localStorage.setItem(STORAGE, JSON.stringify(msgList));
  render();
  showToast("✅ 回复成功");
}

render();
</script>
</body>
</html>
