<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>留言板</title>
</head>
<body>

<h1>云端留言板</h1>
<textarea id="content" placeholder="写留言..." rows="4" cols="50"></textarea>
<br><br>
<button onclick="submitMsg()">提交留言</button>
<hr>
<div id="msgList"></div>

<script>
// ====================== 已帮你填好 ======================
const GIST_ID = 'caddc7792f13ec0ed89f5cf819937505';
const TOKEN = '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';
const FILE_NAME = 'gistfile1.txt';
// ======================================================

// 提交留言
async function submitMsg() {
  const content = document.getElementById('content').value.trim();
  if (!content) return alert('请输入内容');

  try {
    // 先获取当前内容
    let res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: { Authorization: `token ${TOKEN}` }
    });
    let data = await res.json();
    let oldText = data.files[FILE_NAME]?.content || '';

    // 追加新留言
    let newText = oldText + '\n' + new Date().toLocaleString() + '：' + content;

    // 更新到 Gist
    await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: {
        'Authorization': `token ${TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        files: {
          [FILE_NAME]: { content: newText }
        }
      })
    });

    alert('留言成功！');
    document.getElementById('content').value = '';
    loadMsg();
  } catch (e) {
    alert('提交失败：' + e.message);
  }
}

// 加载留言
async function loadMsg() {
  try {
    let res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
    let data = await res.json();
    let text = data.files[FILE_NAME]?.content || '暂无留言';
    document.getElementById('msgList').innerText = text;
  } catch (e) {
    document.getElementById('msgList').innerText = '加载失败';
  }
}

// 一进页面就加载
loadMsg();
</script>

</body>
</html>
